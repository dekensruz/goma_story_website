<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b0082;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad1)" rx="20" ry="20" />
  
  <!-- Cercle pour le visage -->
  <circle cx="200" cy="150" r="100" fill="#f5d0c5" />
  
  <!-- Cheveux -->
  <path d="M120,150 C120,80 280,80 280,150 L280,200 C280,240 240,270 200,270 C160,270 120,240 120,200 Z" fill="#2d2d2d" />
  
  <!-- Visage -->
  <ellipse cx="160" cy="140" rx="10" ry="15" fill="#2d2d2d" />
  <ellipse cx="240" cy="140" rx="10" ry="15" fill="#2d2d2d" />
  <path d="M180,180 Q200,200 220,180" stroke="#2d2d2d" stroke-width="3" fill="none" />
  
  <!-- Microphone -->
  <rect x="190" y="250" width="20" height="100" fill="#c0c0c0" />
  <ellipse cx="200" cy="230" rx="30" ry="20" fill="#303030" />
  
  <!-- Texte -->
  <text x="200" y="350" font-family="Arial" font-size="24" fill="white" text-anchor="middle">Gloria Bash</text>
  <text x="200" y="380" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Artiste de Goma</text>
</svg>